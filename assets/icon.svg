<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="egg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3d1"/>
      <stop offset="1" stop-color="#ec5f9b"/>
    </linearGradient>
  </defs>

  <!-- 地面软阴影 -->
  <ellipse cx="32" cy="52.5" rx="12.5" ry="2.6" fill="#000000" opacity="0.12"/>

  <!-- 两侧震动弧线 -->
  <g fill="none" stroke="#d81b60" stroke-width="2.6" stroke-linecap="round">
    <path d="M13.5 26 Q9.5 32 13.5 38" opacity="0.75"/>
    <path d="M8.5 22.5 Q2.5 32 8.5 41.5" opacity="0.45"/>
    <path d="M50.5 26 Q54.5 32 50.5 38" opacity="0.75"/>
    <path d="M55.5 22.5 Q61.5 32 55.5 41.5" opacity="0.45"/>
  </g>

  <!-- 顶部小火花 -->
  <g stroke="#9575cd" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <path d="M10 12.5 v6 M7 15.5 h6"/>
    <path d="M54 10.5 v5 M51.5 13 h5"/>
  </g>

  <!-- 蛋体 -->
  <path d="M32 11
           C 38.5 11 44 19 44.5 30
           C 45 40.5 39.5 49 32 49
           C 24.5 49 19 40.5 19.5 30
           C 20 19 25.5 11 32 11 Z"
        fill="url(#egg)" stroke="#ad1457" stroke-width="1.4" stroke-opacity="0.35"/>

  <!-- 顶盖接缝 -->
  <path d="M20.6 24.5 Q32 28.5 43.4 24.5" fill="none" stroke="#ad1457" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- 指示灯 -->
  <circle cx="32" cy="17.5" r="1.8" fill="#fff3fa"/>

  <!-- 高光 -->
  <ellipse cx="27.5" cy="20.5" rx="3.2" ry="5.6" fill="#ffffff" opacity="0.5" transform="rotate(-18 27.5 20.5)"/>
</svg>
