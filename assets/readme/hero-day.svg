      <path d="M32 11 C 38.5 11 44 19 44.5 30 C 45 40.5 39.5 49 32 49 C 24.5 49 19 40.5 19.5 30 C 20 19 25.5 11 32 11 Z" fill="url(#eggDay)" stroke="#ad1457" stroke-width="1.4" stroke-opacity="0.35"/>
      <path d="M20.6 24.5 Q32 28.5 43.4 24.5" fill="none" stroke="#ad1457" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
