    <rect x="4" y="4" width="1192" height="292" fill="url(#immDayDots)"/>
    <rect x="4" y="4" width="1192" height="292" fill="url(#immDayGlow1)"/>
    <rect x="4" y="4" width="1192" height="292" fill="url(#immDayGlow2)"/>

