<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="麦麦我真得控制你了 · MaiBot Immersive Control">
  <defs>
    <linearGradient id="immDayBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6fa"/>
      <stop offset="55%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#f3eefe"/>
    </linearGradient>
    <linearGradient id="eggDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3d1"/>
      <stop offset="100%" stop-color="#ec5f9b"/>
