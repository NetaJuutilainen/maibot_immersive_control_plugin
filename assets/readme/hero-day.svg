    <radialGradient id="immDayGlow1" cx="0.82" cy="0.28" r="0.46">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="immDayGlow2" cx="0.92" cy="0.84" r="0.36">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="immDayDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="#d81b60" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="immDayClip">
      <rect x="4" y="4" width="1192" height="292" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#immDayClip)">
