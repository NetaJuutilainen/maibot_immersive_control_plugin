name: ✨ 功能建议
description: 想要新的玩法、配置项或交互方式
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: 想要什么
      description: 一句话说清；有参考插件 / 原版行为可以贴链接
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 使用场景
      description: 什么情况下会用到？现在是怎么绕过去的？
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: 当前插件版本
      placeholder: "例如 1.2.1"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜过现有 issue，没有重复建议
          required: true
